# Tier-1 802.1X authenticator.
#
# hostapd with driver=wired is an IEEE 802.1X authenticator on an Ethernet-like
# interface. There is no radio configuration here because there is no radio: this
# generates genuine EAP-TLS authentication state, not 802.11 association state.

interface=eapauth0
driver=wired

# The wired driver must send EAPOL to the PAE group address, since there is no
# association to bind a per-station destination to.
use_pae_group_addr=1

logger_stdout=-1
logger_stdout_level=1
ctrl_interface=/var/run/hostapd

# 802.1X with the integrated EAP server. No RADIUS server is needed for a
# two-party laboratory exchange, and omitting one removes a moving part.
ieee8021x=1
eap_server=1
eap_user_file=/etc/hostapd/hostapd.eap_user

ca_cert=/etc/hostapd/certs/ca.crt
server_cert=/etc/hostapd/certs/server.crt
private_key=/etc/hostapd/certs/server.key
dh_file=/etc/hostapd/certs/dh.pem

# Require a client certificate: EAP-TLS is mutual, which is what makes the
# identity binding meaningful.
eap_fast_a_id=0000
tls_flags=[DISABLE-TLSv1.0][DISABLE-TLSv1.1]
