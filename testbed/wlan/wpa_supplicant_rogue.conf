# Invalid-certificate scenario: a client certificate from an untrusted CA.
# Authentication must fail, and that failure must reach the collector as evidence.
ctrl_interface=/var/run/wpa_supplicant
ap_scan=0

network={
    key_mgmt=IEEE8021X
    eap=TLS
    identity="rogue@lab.invalid"
    ca_cert="/etc/wpa_supplicant/certs/ca.crt"
    client_cert="/etc/wpa_supplicant/certs/rogue-client.crt"
    private_key="/etc/wpa_supplicant/certs/rogue-client.key"
    eapol_flags=0
}
