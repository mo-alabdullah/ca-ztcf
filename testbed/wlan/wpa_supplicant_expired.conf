# Expired-chain scenario: a client certificate whose validity period has passed.
ctrl_interface=/var/run/wpa_supplicant
ap_scan=0

network={
    key_mgmt=IEEE8021X
    eap=TLS
    identity="expired@lab.invalid"
    ca_cert="/etc/wpa_supplicant/certs/ca.crt"
    client_cert="/etc/wpa_supplicant/certs/expired-client.crt"
    private_key="/etc/wpa_supplicant/certs/expired-client.key"
    eapol_flags=0
}
