# Mosquitto configuration for the CA-ZTCF research testbed.
#
# The broker is a RESOURCE, not a policy point. All access control happens at the
# CA-ZTCF MQTT enforcement point in front of it. The broker therefore accepts the
# connections the enforcement point forwards, and is reachable ONLY from the
# isolated research network: the Compose service publishes no host port, so
# nothing outside the Docker network can reach it.
#
# `allow_anonymous true` is safe only because of that isolation, and only because
# every client reaching the broker has already been authorised by the enforcement
# point. Never expose this broker directly.

listener 1883
protocol mqtt

# Only the enforcement point connects, and it has already applied policy.
allow_anonymous true

# Bounded resource use; these are research defaults, not tuned values.
max_connections 500
max_queued_messages 1000
message_size_limit 262144

# Logging: enough to correlate broker behaviour with enforcement decisions.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# No persistence: every run starts from a clean broker state, which is required
# for scenario determinism.
persistence false
