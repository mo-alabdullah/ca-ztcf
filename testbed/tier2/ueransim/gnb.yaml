# UERANSIM gNB for the CA-ZTCF Tier-2 software-based testbed.
#
# A SOFTWARE gNB. It speaks real NGAP to Open5GS AMF and real GTP-U to the UPF,
# but synthesises the radio. There is no physical RF.
#
# PLMN 999/70 is the 3GPP-reserved test network. Every identifier here is a
# synthetic research value.
mcc: '999'
mnc: '70'

nci: '0x000000010'
idLength: 32
tac: 1

# linkIp is the Radio Link Simulation endpoint the UE dials. It is the root end
# of the veth into the ca-ztcf-ue namespace, not loopback, because the UE runs
# in that namespace so that its application traffic can only leave through the
# UE tunnel. NGAP and GTP-U stay on loopback: the AMF and UPF are co-located
# with the gNB in the root namespace.
linkIp: 10.200.0.1
ngapIp: 127.0.0.1
gtpIp: 127.0.0.1

amfConfigs:
  - address: 127.0.0.5
    port: 38412

slices:
  - sst: 1

ignoreStreamIds: true
