# Tier-2 802.11 access point over a mac80211_hwsim virtual radio.
#
# This is a REAL IEEE 802.11 access point using the Linux mac80211/cfg80211
# stack: real association, real WPA2-Enterprise 4-way handshake, real EAP-TLS.
# The PHY is simulated by mac80211_hwsim, so there is no RF propagation, no
# interference and no channel measurement.
interface=wlan0
driver=nl80211

ssid=ca-ztcf-tier2
hw_mode=g
channel=1
country_code=US

ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
logger_stdout=-1
logger_stdout_level=1

# WPA2-Enterprise with 802.1X and the integrated EAP server. No RADIUS server is
# needed for a two-party laboratory exchange, and omitting one removes a moving
# part.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-EAP
rsn_pairwise=CCMP

ieee8021x=1
eap_server=1
eap_user_file=/etc/hostapd/hostapd.eap_user

ca_cert=/etc/hostapd/certs/ca.crt
server_cert=/etc/hostapd/certs/server.crt
private_key=/etc/hostapd/certs/server.key
dh_file=/etc/hostapd/certs/dh.pem

tls_flags=[DISABLE-TLSv1.0][DISABLE-TLSv1.1]
