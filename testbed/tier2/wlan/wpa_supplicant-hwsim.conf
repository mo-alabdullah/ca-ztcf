# Tier-2 supplicant: real 802.11 association plus EAP-TLS over a virtual radio.
ctrl_interface=/var/run/wpa_supplicant
ap_scan=1

network={
    ssid="ca-ztcf-tier2"
    key_mgmt=WPA-EAP
    eap=TLS
    identity="device@lab.invalid"
    ca_cert="/etc/wpa_supplicant/certs/ca.crt"
    client_cert="/etc/wpa_supplicant/certs/client.crt"
    private_key="/etc/wpa_supplicant/certs/client.key"
}
