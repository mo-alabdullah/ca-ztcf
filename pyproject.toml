[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-ztcf"
version = "1.0.2"
description = "Coexistence-Aware Zero Trust Continuity Framework - research prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Mohammed Alabdullah" }]
keywords = ["zero-trust", "iot", "5g", "wifi", "authentication", "trust-continuity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "prometheus-client>=0.20,<1.0",
  "cryptography>=43.0",
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8",
]
dev = [
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pytest-asyncio>=0.24",
]

[project.urls]
Repository = "https://github.com/REPLACE-WITH-ACTUAL-REPOSITORY/ca-ztcf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ca_ztcf = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S"]
ignore = ["ANN401", "S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "N802"]
"scripts/*" = ["S", "ANN"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ca_ztcf"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["ca_ztcf.trust_engine.*", "ca_ztcf.policy.*", "ca_ztcf.evidence.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: integration tests requiring the assembled application"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/ca_ztcf"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
