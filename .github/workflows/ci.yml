name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Tests with coverage
        run: make test-cov

      - name: Secret scan
        run: make secret-scan

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  container:
    name: Container build and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Build image
        run: docker compose -f deploy/compose/core.yml build

      - name: Start service
        run: docker compose -f deploy/compose/core.yml up -d

      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' ca-ztcf 2>/dev/null || echo starting)
            echo "attempt ${attempt}: ${state}"
            if [ "${state}" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose -f deploy/compose/core.yml logs
          exit 1

      - name: Endpoint checks
        run: |
          set -euo pipefail
          curl -fsS localhost:8080/healthz
          curl -fsS localhost:8080/readyz
          curl -fsS localhost:8080/version
          curl -fsS localhost:8080/config/hash
          curl -fsS localhost:8080/metrics > /dev/null

      - name: Development validation flow
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography
          python scripts/dev_validation_flow.py --base-url http://127.0.0.1:8080 \
            --out artifacts/dev-validation

      - name: Service logs on failure
        if: failure()
        run: docker compose -f deploy/compose/core.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/core.yml down -v
