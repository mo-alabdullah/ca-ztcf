# Seeds for the CA-ZTCF final experiment campaign.
#
# FROZEN BEFORE EXECUTION. Defined by a fixed rule, 20260906 + i for i in 1..30,
# so that the list is transparently not a selection made after seeing results.
#
# Pairing. Every repetition uses the SAME seed across the three primary
# strategies, so A, B300 and C observe the same scenario randomisation and the
# comparison is paired. The TTL sensitivity variants reuse the same seeds for the
# same reason.
#
# A seed drives scenario sequencing only. It is never used for key material:
# device keys come from the system CSPRNG, so a laboratory key is still a real
# key, and determinism comes from the clock and the scenario rather than from
# predictable secrets.
#
# Do not add, remove or reorder these after the campaign has begun. A run that
# fails for an infrastructure reason is retried with its OWN seed, never replaced
# by a different one.
rule: "20260906 + i, for i in 1..30"
count: 30
